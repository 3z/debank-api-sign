[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debank-api-sign"
version = "1.0.0"
description = "Reverse-engineered request signing for the DeBank API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["debank", "api", "signing", "web3", "defi", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
client = ["requests>=2.25.0"]

[project.urls]
Repository = "https://github.com/youruser/debank-api-sign"

[tool.setuptools.packages.find]
include = ["debank_sign*"]
